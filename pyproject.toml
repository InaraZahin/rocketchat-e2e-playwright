[project]
name = "rocketchat-e2e"
version = "1.0.0"
description = "End-to-end regression suite for Rocket.Chat (Playwright + pytest)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.50,<2",
    "pytest>=8.0,<10",
    "pytest-playwright>=0.7,<1",
    "pytest-xdist>=3.5,<4",
    "pytest-html>=4.1,<5",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pre-commit>=3.7"]

[tool.setuptools]
packages = ["framework", "pages", "pages.components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Keep evidence only for failures: traces, screenshots and videos land in test-results/.
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--video=retain-on-failure",
    "--output=test-results",
]
markers = [
    "smoke: fast, critical-path checks run on every change",
    "regression: broader functional coverage",
    "api: tests that exercise the REST API only (no browser)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
