# Disposable Rocket.Chat + MongoDB stack for running the suite locally and in CI.
# Usage: docker compose up -d --wait
services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # Initiates the single-node replica set (required by Rocket.Chat) on first start.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  rocketchat:
    image: rocketchat/rocket.chat:${RC_VERSION:-9.0.0}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      ROOT_URL: http://localhost:3000
      PORT: "3000"
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      # Bootstrap an admin account so tests can authenticate immediately.
      ADMIN_USERNAME: ${RC_ADMIN_USERNAME:-e2e.admin}
      ADMIN_PASS: ${RC_ADMIN_PASSWORD:-E2e-Admin-Pass-1}
      ADMIN_EMAIL: ${RC_ADMIN_EMAIL:-e2e.admin@example.com}
      # Make the server deterministic for automation.
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
      OVERWRITE_SETTING_API_Enable_Rate_Limiter: "false"
      OVERWRITE_SETTING_DDP_Rate_Limit_IP_Enabled: "false"
      OVERWRITE_SETTING_DDP_Rate_Limit_User_Enabled: "false"
      OVERWRITE_SETTING_DDP_Rate_Limit_Connection_Enabled: "false"
      OVERWRITE_SETTING_DDP_Rate_Limit_User_By_Method_Enabled: "false"
      OVERWRITE_SETTING_DDP_Rate_Limit_Connection_By_Method_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_Email_Enabled: "false"
      OVERWRITE_SETTING_Accounts_TwoFactorAuthentication_By_Email_Auto_Opt_In: "false"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/info').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
